<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O Circuito do Bit</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#122d48,#215e6b);font:600 16px system-ui;color:white;text-align:center}header{padding:13px}h1{margin:5px;font-size:clamp(24px,4vw,38px)}p{margin:7px}canvas{display:block;width:min(96vw,720px);aspect-ratio: 1.45;margin:10px auto;border:5px solid #85ecde;border-radius:22px;background:#0c263e;touch-action:none;box-shadow:0 18px 50px #071a28}button,a{font:800 17px system-ui;border:0;border-radius:14px;padding:13px 19px;background:#ffe28b;color:#173f44;cursor:pointer;text-decoration:none}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px}.controls button{min-width:62px}#msg{color:#ffe28b;min-height:26px}small{color:#c4e9e8}.portal-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}.portal-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px}.portal-nav a:focus-visible{outline:3px solid currentColor;outline-offset:4px}</style><header><nav class="portal-nav" aria-label="Navegação dos jogos"><a href="../../index.html#inicio">← Início do portal</a><a href="../index.html">← Jogos</a></nav><h1>🤖 O Circuito do Bit</h1><p>Empurre as duas baterias até os terminais brilhantes!</p><small>Setas / WASD ou botões • R reinicia</small></header><canvas id="game" width="720" height="500"></canvas><div id="msg">⚡ Ligue os dois terminais para abrir a porta!</div><div class="controls"><button data-d="0,-1">▲</button><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button><button id="restart">↻ Reiniciar</button></div><script>
(()=>{'use strict';const c=document.querySelector('canvas'),x=c.getContext('2d'),msg=document.querySelector('#msg');const raw=['############','#.........#','#..B......#','#.........#','#....##...#','#...T.....#','#.........#','#..B...T..#','#.........#','############'];let walls,goals,boxes,player,win=false,steps=0,t=0,particles=[];let ac;function sound(f=500,d=.12){try{ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.3,ac.currentTime+d);g.gain.setValueAtTime(.09,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}const id=(a,b)=>a+','+b;function reset(){walls=new Set();goals=new Set();boxes=new Set();raw.forEach((line,j)=>[...line].forEach((q,i)=>{if(q==='#')walls.add(id(i,j));if(q==='T')goals.add(id(i,j));if(q==='B')boxes.add(id(i,j))}));player={x:2,y:5};win=false;steps=0;particles=[];msg.textContent='⚡ Ligue os dois terminais para abrir a porta!';sound(360)}function move(dx,dy){if(win)return;let a=player.x+dx,b=player.y+dy,k=id(a,b);if(walls.has(k)){sound(130,.07);return}if(boxes.has(k)){let next=id(a+dx,b+dy);if(walls.has(next)||boxes.has(next)){sound(130,.07);return}boxes.delete(k);boxes.add(next);sound(380,.1)}player={x:a,y:b};steps++;sound(620,.045);if([...goals].every(k=>boxes.has(k))){win=true;msg.textContent='🎉 Circuito ligado! O Bit abriu a porta!';for(let i=0;i<70;i++)particles.push({x:360,y:200,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:90});[500,650,800].forEach((f,i)=>setTimeout(()=>sound(f,.22),i*140))}}const key=e=>{let v=({ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]})[e.key];if(v){e.preventDefault();move(...v)}if(e.key.toLowerCase()==='r')reset()};window.addEventListener('keydown',key);document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...b.dataset.d.split(',').map(Number)));document.querySelector('#restart').onclick=reset;function rr(px,py,w,h,r,color){x.fillStyle=color;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}function draw(){t++;let W=c.width,H=c.height;x.clearRect(0,0,W,H);let gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#174f68');gr.addColorStop(1,'#0b213d');x.fillStyle=gr;x.fillRect(0,0,W,H);let size=44,ox=96,oy=30;for(let j=0;j<10;j++)for(let i=0;i<11;i++){let px=ox+i*size,py=oy+j*size,k=id(i,j);rr(px+1,py+1,size-2,size-2,6,walls.has(k)?'#325476':'#245d71');if(!walls.has(k)){x.fillStyle='#39768a';x.fillRect(px+7,py+size-6,size-14,2)}if(goals.has(k)){x.shadowBlur=18;x.shadowColor='#ffe66b';rr(px+6,py+6,32,32,10,boxes.has(k)?'#7dffc9':'#ffdb63');x.shadowBlur=0;x.fillStyle='#174c59';x.font='bold 23px system-ui';x.textAlign='center';x.fillText('⚡',px+22,py+29)}if(boxes.has(k)){let yy=Math.sin(t*.055+i)*2;rr(px+5,py+4+yy,34,35,8,'#f6a857');rr(px+9,py+8+yy,26,26,6,'#ffe0a0');x.fillStyle='#a75d32';x.fillRect(px+20,py+9+yy,4,25);x.fillRect(px+10,py+20+yy,24,4)}}let px=ox+player.x*size,py=oy+player.y*size+Math.sin(t*.1)*2;rr(px+4,py+8,36,32,11,'#e4faff');rr(px+9,py+14,26,19,6,'#1b455c');x.fillStyle='#70ffef';x.fillRect(px+13,py+19,6,7);x.fillRect(px+25,py+19,6,7);x.fillStyle='#e4faff';x.fillRect(px+9,py+3,5,8);x.fillRect(px+30,py+3,5,8);x.fillStyle='#f99b67';x.fillRect(px+20,py+27,4,3);x.textAlign='left';x.font='bold 17px system-ui';x.fillStyle='#d8fdf7';x.fillText('PASSOS: '+steps,20,478);x.fillText('TERMINAIS: '+[...goals].filter(k=>boxes.has(k)).length+'/2',480,478);if(win){rr(165,175,390,120,20,'#133e56e8');x.textAlign='center';x.fillStyle='#fff4b2';x.font='bold 28px system-ui';x.fillText('✨ PORTA DESBLOQUEADA! ✨',360,225);x.font='18px system-ui';x.fillText('Você resolveu o circuito!',360,259)}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;x.fillStyle='#ffde73';x.fillRect(p.x,p.y,5,5)});particles=particles.filter(p=>p.life>0);requestAnimationFrame(draw)}reset();draw()})();
</script></html>
