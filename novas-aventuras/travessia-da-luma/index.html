<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Travessia da Luma</title><style>*{box-sizing:border-box}body{margin:0;text-align:center;color:#153d42;font:600 16px system-ui;background:linear-gradient(#b2ebff,#e5ffdb)}header{padding:14px}h1{margin:8px;font-size:clamp(25px,5vw,40px)}p{margin:6px}canvas{display:block;width:min(96vw,760px);aspect-ratio:1.45;margin:10px auto;border:5px solid #fff;border-radius:23px;box-shadow:0 14px 36px #26587955;touch-action:none}button,a{border:0;background:#ffda72;color:#164c4a;border-radius:14px;padding:13px 18px;font:800 17px system-ui;text-decoration:none;cursor:pointer}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}#msg{min-height:27px;color:#17675b}.portal-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}.portal-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px}.portal-nav a:focus-visible{outline:3px solid currentColor;outline-offset:4px}</style><header><nav class="portal-nav" aria-label="Navegação dos jogos"><a href="../../index.html#inicio">← Início do portal</a><a href="../index.html">← Jogos</a></nav><h1><img src="../luma-rosto.svg" alt="Carinha da Luma, gatinha cinza" style="width:48px;height:48px;vertical-align:middle;object-fit:contain"> A Travessia da Luma</h1><p>Salte pelas ilhas flutuantes, pegue 3 estrelas e alcance o jardim!</p><small>Setas / WASD ou botões • Espaço para saltar • R reinicia</small></header><canvas id="game" width="760" height="525"></canvas><div id="msg">🌟 Colete as três estrelas para abrir o jardim!</div><div class="controls"><button data-key="left">◀</button><button data-key="jump">▲ Pular</button><button data-key="right">▶</button><button id="reset">↻ Reiniciar</button></div><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),msg=document.querySelector('#msg');let ac;function tone(f,d=.13){try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,ac.currentTime+d);v.gain.setValueAtTime(.09,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}const platforms=[{x:0,y:445,w:170},{x:215,y:400,w:105},{x:365,y:345,w:120},{x:535,y:390,w:105},{x:675,y:445,w:190},{x:900,y:385,w:105},{x:1055,y:335,w:110},{x:1220,y:390,w:100},{x:1360,y:445,w:200}],stars=[{x:270,y:355},{x:590,y:345},{x:1108,y:292}],hazards=[{x:455,y:325,r:15},{x:960,y:345,r:16}];let p,got,win,cam,frame,keys={left:false,right:false},effects=[];function reset(){p={x:55,y:390,vx:0,vy:0,ground:false};got=new Set();win=false;cam=0;frame=0;effects=[];msg.textContent='🌟 Colete as três estrelas para abrir o jardim!'}function jump(){if(p.ground&&!win){p.vy=-13.2;p.ground=false;tone(450,.12)}}function rr(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function move(){if(win)return;frame++;let prevBottom=p.y+39;if(keys.left)p.vx=Math.max(-4.3,p.vx-.55);else if(keys.right)p.vx=Math.min(4.3,p.vx+.55);else p.vx*=.78;p.x=Math.max(5,Math.min(1520,p.x+p.vx));p.vy+=.57;p.y+=p.vy;p.ground=false;for(let a of platforms){if(p.vy>=0&&prevBottom<=a.y+6&&p.y+39>=a.y&&p.x+28>a.x&&p.x<a.x+a.w){p.y=a.y-39;p.vy=0;p.ground=true}}if(p.y>560){p.x=55;p.y=390;p.vx=0;p.vy=0;tone(170,.3);msg.textContent='💦 Ops! Tente saltar mais perto da borda.'}stars.forEach((s,i)=>{if(!got.has(i)&&Math.hypot(p.x+14-s.x,p.y+20-s.y)<35){got.add(i);tone(700+i*150,.22);msg.textContent='⭐ Estrelas: '+got.size+'/3';for(let j=0;j<12;j++)effects.push({x:s.x,y:s.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:30})}});hazards.forEach((h,i)=>{let hy=h.y+Math.sin(frame*.045+i)*18;if(Math.hypot(p.x+14-h.x,p.y+20-hy)<h.r+14){p.vx=-3;p.vy=-7;tone(150,.22);msg.textContent='🌀 Cuidado com os redemoinhos!'}});if(p.x>1450&&got.size===3){win=true;msg.textContent='🎉 A Luma chegou ao jardim! Travessia concluída!';[600,780,980].forEach((f,i)=>setTimeout(()=>tone(f,.3),i*180))}else if(p.x>1450&&got.size<3)msg.textContent='🔒 Faltam '+(3-got.size)+' estrelas para abrir o jardim!';cam+=(Math.max(0,Math.min(800,p.x-240))-cam)*.09}function draw(){g.clearRect(0,0,760,525);let bg=g.createLinearGradient(0,0,0,525);bg.addColorStop(0,'#75d6ff');bg.addColorStop(1,'#b9efff');g.fillStyle=bg;g.fillRect(0,0,760,525);g.fillStyle='#fff9c1';g.beginPath();g.arc(640,90,43,0,7);g.fill();for(let i=0;i<10;i++){let xx=((i*187-frame*.17-cam*.14)%1000+1000)%1000-120,yy=75+(i%3)*45;rr(xx,yy,105,24,20,'#ffffffb9');rr(xx+20,yy-12,60,30,20,'#ffffffb9')}for(let i=0;i<8;i++){let xx=i*230-cam*.35;g.fillStyle='#72b7b9';g.beginPath();g.moveTo(xx-100,355);g.lineTo(xx+100,185);g.lineTo(xx+290,355);g.fill()}g.fillStyle='#2e9ed1';g.fillRect(0,440,760,85);for(let i=0;i<18;i++){g.strokeStyle='#b8f4ff9c';g.lineWidth=3;g.beginPath();let xx=i*55+Math.sin(frame*.04+i)*13;g.moveTo(xx,470+i%3*15);g.quadraticCurveTo(xx+20,461+i%3*15,xx+40,470+i%3*15);g.stroke()}g.save();g.translate(-cam,0);platforms.forEach((a,i)=>{rr(a.x,a.y,a.w,65,13,'#825b42');rr(a.x,a.y,a.w,19,12,'#69c86c');for(let j=12;j<a.w-10;j+=28){g.fillStyle=j%3?'#ffb9d8':'#ffe97d';g.beginPath();g.arc(a.x+j,a.y+4,3,0,7);g.fill()}});stars.forEach((s,i)=>{if(got.has(i))return;let y=s.y+Math.sin(frame*.08+i)*7;g.save();g.translate(s.x,y);g.rotate(frame*.014);g.fillStyle='#ffe36e';g.shadowBlur=20;g.shadowColor='#fff6a1';g.beginPath();for(let k=0;k<10;k++){let a=-Math.PI/2+k*Math.PI/5,r=k%2?9:20;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore()});hazards.forEach((h,i)=>{let y=h.y+Math.sin(frame*.045+i)*18;g.strokeStyle='#c8f8ff';g.lineWidth=5;g.beginPath();g.arc(h.x,y,h.r+5,frame*.08,frame*.08+Math.PI*1.5);g.stroke();g.fillStyle='#197cbb';g.beginPath();g.arc(h.x,y,h.r,0,7);g.fill()});rr(1460,365,75,80,16,got.size===3?'#ffd976':'#7b8b95');g.fillStyle='#234f56';g.font='bold 35px system-ui';g.fillText('✿',1481,420);let yy=p.y+Math.sin(frame*.08)* (p.ground?1.5:0);g.fillStyle='#a4a7b7';g.beginPath();g.ellipse(p.x+14,yy+24,22,21,0,0,7);g.fill();g.beginPath();g.moveTo(p.x-4,yy+10);g.lineTo(p.x-1,yy-11);g.lineTo(p.x+11,yy+3);g.lineTo(p.x+20,yy-11);g.lineTo(p.x+33,yy+12);g.fill();g.fillStyle='#e6dce7';g.beginPath();g.ellipse(p.x+14,yy+24,15,12,0,0,7);g.fill();g.fillStyle='#293748';g.beginPath();g.arc(p.x+8,yy+20,2.7,0,7);g.arc(p.x+21,yy+20,2.7,0,7);g.fill();g.fillStyle='#e08d9e';g.beginPath();g.arc(p.x+15,yy+26,2.5,0,7);g.fill();g.strokeStyle='#e5e4ee';g.lineWidth=2;for(let side of [-1,1])for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(p.x+15,yy+27);g.lineTo(p.x+15+side*25,yy+27+k*6);g.stroke()}effects.forEach(e=>{e.x+=e.vx;e.y+=e.vy;e.vy+=.08;e.life--;g.fillStyle='#fff1a4';g.fillRect(e.x,e.y,5,5)});effects=effects.filter(e=>e.life>0);g.restore();rr(15,15,185,44,15,'#164e63c9');g.font='bold 19px system-ui';g.fillStyle='white';g.fillText('⭐ '+got.size+'/3   🌸 Jardim',32,44);if(win){rr(160,170,440,150,24,'#154f5fe8');g.fillStyle='#fff2a3';g.textAlign='center';g.font='bold 31px system-ui';g.fillText('🌸 TRAVESSIA CONCLUÍDA!',380,230);g.font='18px system-ui';g.fillText('As estrelas iluminaram o jardim!',380,267);g.textAlign='left'}}function loop(){move();draw();requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k==='arrowup'||k==='w'||k===' ')jump();if(k==='r')reset()});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;if(k==='jump'){b.onclick=jump;return}b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false});document.querySelector('#reset').onclick=reset;reset();loop()})();
</script></html>
